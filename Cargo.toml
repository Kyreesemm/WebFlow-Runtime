[package]
name = "webflow-runtime"
version = "0.1.0"
edition = "2021"
build = "build.rs"
authors = ["WebFlow Team"]
description = "Ultra-lightweight engine to turn websites into desktop applications"

[[bin]]
name = "webflow-runtime"
path = "src/main.rs"

[dependencies]
tao = "0.36"
wry = "0.56"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
rust-embed = "8.5"
open = "5.3"
tempfile = "3.17"
rfd = "0.15"
walkdir = "2.5"
mime_guess = "2.0"
base64 = "0.22"
png = "0.17"
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[build-dependencies]
embed-resource = "3.0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
