[package]
name = "webflow-runtime"
version = "0.1.0"
edition = "2021"
authors = ["WebFlow Team"]
description = "Ultra-lightweight engine to turn websites into desktop applications"

[[bin]]
name = "webflow-runtime"
path = "src/main.rs"

[dependencies]
tao = "0.36"
wry = "0.56"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
rust-embed = "8.5"
open = "5.3"
tempfile = "3.17"
rfd = "0.15"
walkdir = "2.5"
mime_guess = "2.0"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
